---
name: Build and Test
"on":
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  # Tag builds run this via release.yml.
  workflow_call:
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check style
        run: go run mage.go style

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GTK3 development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - name: Lint
        run: go run mage.go lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GTK3 development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      - name: Test
        run: go run mage.go test
      - name: Merge Coverage Files
        run: go run mage.go coverage
      - name: Coveralls
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: .cover.out

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GTK3 development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev
      # Only needed if the project has a web interface under web/.
      - name: Setup Node
        if: hashFiles('web/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: go run mage.go binary

  # Ubuntu packages are built (and checked to replace seahorse cleanly) on every push and
  # pull request, so a broken package build fails CI. They are never attached to GitHub
  # Releases; they are published only through a package repository.
  packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        series:
          - noble
          - resolute
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Ubuntu packages
        run: go run mage.go debSeries ${{ matrix.series }}
      - name: Check the package replaces seahorse
        run: tools/debian/install-test.sh ${{ matrix.series }}

  # Fedora RPMs, built and install-tested the same way.
  rpms:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora:
          - "43"
          - "44"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Fedora RPMs
        run: go run mage.go rpmRelease ${{ matrix.fedora }}
      - name: Check the package replaces seahorse
        run: tools/rpm/install-test.sh ${{ matrix.fedora }}
