# Example configuration. landhorse reads $XDG_CONFIG_HOME/landhorse/landhorse.yml
# (normally ~/.config/landhorse/landhorse.yml) when it exists, or the file named by
# --config-file. Every key is optional; the values below are the defaults.
# Keys map to EntrypointConfig in pkg/entrypoints/landhorse/config.go.

passwords:
  # Keyrings and passwords from the Secret Service (gnome-keyring, KeePassXC).
  disabled: false
  # Extra groups under every keyring, one per attribute, with a subcategory for each of the
  # attribute's values. Usually edited in Edit → Preferences. Title defaults to the
  # attribute name. Network passwords are always grouped by host.
  # groups:
  #   - attribute: service
  #     title: Services

pgp:
  disabled: false
  # gpg executable, looked up on PATH.
  binary: gpg
  # Overrides GNUPGHOME when set.
  home: ""
  # Keyservers offered by "Publish…" and "Revoke…", each a URI optionally followed by a
  # space and a display name. When unset, landhorse uses the same keyservers as Seahorse:
  # the org.gnome.crypto.pgp keyservers setting (Ubuntu sets hkps://keyserver.ubuntu.com),
  # or upstream Seahorse's defaults below if that setting doesn't exist. An empty list ([])
  # disables publishing.
  # keyservers:
  #   - ldap://keyserver.pgp.com
  #   - hkps://keys.openpgp.org

security_keys:
  # Smart cards (PIV) through PKCS#11 with GnuTLS's p11tool, and passkeys on FIDO2
  # security keys with libfido2's fido2-token.
  disabled: false
  p11tool: p11tool
  fido2_token: fido2-token

ssh:
  disabled: false
  # Directory scanned for OpenSSH keys. Empty means ~/.ssh.
  directory: ""
  # SSH agent whose loaded keys are listed. Empty means $SSH_AUTH_SOCK.
  agent_socket: ""
